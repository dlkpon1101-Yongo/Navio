# Navio 智能客服系统 — 全栈 Docker Compose 编排
# 从仓库根目录执行: docker compose up -d --build
#
# 服务组成：
#   redis      工作记忆（三级记忆之 Redis）
#   chromadb   向量数据库（RAG 知识库 + 情景记忆 + 用户画像）
#   prometheus 在线监控指标采集
#   navio      后端 FastAPI 主应用
#   frontend   前端 Nginx（静态页面 + /api/python 反代到 navio）

name: navio

services:

  # ── Redis（工作记忆）────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: navio-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-navio123}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - navio-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-navio123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB（向量数据库）───────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.23
    container_name: navio-chromadb
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - navio-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Prometheus（监控）───────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: navio-prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./Navio/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks:
      - navio-network

  # ── Navio 后端（FastAPI）────────────────────────────────────────────────────
  navio:
    build:
      context: ./Navio
      dockerfile: Dockerfile
      target: production
    container_name: navio-app
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # 容器内固定值，覆盖 .env 中的本地路径
      - REDIS_URL=redis://:${REDIS_PASSWORD:-navio123}@redis:6379/0
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - EVAL_BASELINE_PATH=/app/data/eval/baseline.json
      - NAVIO_SKILLS_DIR=/app/skills
    volumes:
      - navio-data:/app/data
      - ./Navio/skills:/app/skills
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - navio-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── Navio 前端（Nginx）──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./NavioFrontend
      dockerfile: Dockerfile
    container_name: navio-frontend
    ports:
      - "5174:80"
    depends_on:
      navio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - navio-network

# ── 网络 ────────────────────────────────────────────────────────────────────
networks:
  navio-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── 数据卷 ──────────────────────────────────────────────────────────────────
volumes:
  redis-data:
  chromadb-data:
  prometheus-data:
  navio-data:
